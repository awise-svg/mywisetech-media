name: Import locker original photos
on:
  push:
    paths:
      - ".github/workflows/import-locker-batch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download originals
        run: |
          set -euo pipefail
          curl -fsSL -o locker-draw.jpg.b64 https://litter.catbox.moe/dtc3sv.b64
          curl -fsSL -o locker-hold.jpg.b64 https://litter.catbox.moe/5025ff.b64
          curl -fsSL -o locker-staff.jpg.b64 https://litter.catbox.moe/5we3wc.b64
          curl -fsSL -o guard-facility.jpg.b64 https://litter.catbox.moe/etny6c.b64
          echo "264ae2f633342df43feb60f91c6809bf  locker-draw.jpg.b64" | md5sum -c
          echo "98c16ffa143d5e5ff574b87702512a64  locker-hold.jpg.b64" | md5sum -c
          echo "6f5c90223a17eb94a2890c47fd7a9b1c  locker-staff.jpg.b64" | md5sum -c
          echo "e3fd724c795e245ddb26d4b612e747c6  guard-facility.jpg.b64" | md5sum -c
      - name: Commit photos
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locker-draw.jpg.b64 locker-hold.jpg.b64 locker-staff.jpg.b64 guard-facility.jpg.b64
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add original Wise product photos"
          git push
