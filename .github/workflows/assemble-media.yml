name: assemble-media
on:
  push:
    paths:
      - 'parts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble b64 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          EXPAND = re.compile(r'\{\{([A-Za-z0-9+/=]+):(\d+)\}\}')
          def expand(text):
              return EXPAND.sub(lambda m: m.group(1) * int(m.group(2)), text)
          parts = Path('parts')
          parts.mkdir(exist_ok=True)
          for stem in ['shop-floor.jpg.b64', 'cad-fixtures.jpg.b64']:
              files = sorted(p for p in parts.glob(stem + '.p*') if p.is_file())
              if not files:
                  print('skip', stem)
                  continue
              chunks = [expand(f.read_text(encoding='ascii')) for f in files]
              data = ''.join(chunks)
              Path(stem).write_text(data, encoding='ascii')
              print(stem, len(data), 'from', len(files), 'parts')
          PY
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop-floor.jpg.b64 cad-fixtures.jpg.b64
          git diff --cached --quiet || git commit -m "Assemble original product photo b64 files"
          git push
